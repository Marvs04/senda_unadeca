server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service
    location /api/v1/ {
        proxy_pass         http://senda-backend:4000/api/v1/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /health {
        proxy_pass http://senda-backend:4000/health;
    }

    # SPA fallback — always serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        # No cache for HTML so browsers always get the latest app shell
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
