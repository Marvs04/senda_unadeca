# SENDA — Infraestructura: nginx-proxy + Cloudflare Tunnel
# NUNCA apagar este stack — es el que mantiene todos los subdominios en línea.
#
# Requiere: infra/.env con CF_TUNNEL_TOKEN
#
# Levantar: docker compose -f infra/docker-compose.yml --project-directory . -p infra up -d
# Bajar:    docker compose -f infra/docker-compose.yml --project-directory . -p infra down

name: infra-senda

networks:
  stamp-net:
    external: true

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    networks:
      - stamp-net
    expose:
      - "80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/.htpasswd_senda:/etc/nginx/.htpasswd_senda:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    networks:
      - stamp-net
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx
