# SENDA — Infraestructura: nginx reverse proxy
#
# Expone el puerto 80 públicamente. El enrutamiento externo (DNS, SSL,
# Cloudflare, Traefik, etc.) queda a cargo de quien despliega.
#
# Levantar: docker compose -f infra/docker-compose.yml --project-directory . -p infra up -d
# Bajar:    docker compose -f infra/docker-compose.yml --project-directory . -p infra down

name: infra-senda

networks:
  stamp-net:
    external: true

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    networks:
      - stamp-net
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/.htpasswd_senda:/etc/nginx/.htpasswd_senda:ro
