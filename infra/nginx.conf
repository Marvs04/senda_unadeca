events {}

http {
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # senda.rlp.lat → Frontend (React app)
    server {
        listen 80;
        server_name senda.rlp.lat;

        location / {
            set $upstream http://senda-frontend:80;
            proxy_pass         $upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # sendasupabase.rlp.lat → Supabase Studio (protegido con Basic Auth)
    server {
        listen 80;
        server_name sendasupabase.rlp.lat;

        auth_basic           "SENDA Supabase";
        auth_basic_user_file /etc/nginx/.htpasswd_senda;

        location / {
            set $upstream http://senda-studio:3000;
            proxy_pass         $upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # sendasupabaseapi.rlp.lat → Kong (API Gateway de Supabase)
    server {
        listen 80;
        server_name sendasupabaseapi.rlp.lat;
        client_max_body_size 0;

        location / {
            set $upstream http://senda-kong:8000;
            proxy_pass         $upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 900;
        }
    }
}
