api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - senda-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "senda"
      .event_message = del(.message)
      .appname = del(.container_name)
      del(.container_created_at)
      del(.container_id)
      del(.source_type)
      del(.stream)
      del(.label)

sinks:
  logflare:
    type: http
    inputs:
      - project_logs
    encoding:
      codec: json
    method: post
    request:
      retry_max_duration_secs: 10
    uri: http://senda-analytics:4000/api/logs?source_name=docker&api_key=${LOGFLARE_API_KEY}
