<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="SENDA — Sistema de Horas Beca UNADECA">

  <defs>
    <!-- Gold gradient (outer ring & accents) -->
    <linearGradient id="sg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F0CC6E"/>
      <stop offset="45%"  stop-color="#C9A843"/>
      <stop offset="100%" stop-color="#9C7D2A"/>
    </linearGradient>

    <!-- Navy radial gradient (slight depth) -->
    <radialGradient id="sg-navy" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#26447e"/>
      <stop offset="100%" stop-color="#1d3261"/>
    </radialGradient>

    <!-- Glow for the destination star node -->
    <filter id="sg-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle inner shadow for depth on main circle -->
    <filter id="sg-inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arc for top text: center=(110,110), r≈84 -->
    <!-- Sweeps upward from left-mid (26,110) to right-mid (194,110) -->
    <path id="sg-topArc" d="M 26,110 A 84,84 0 0,1 194,110" fill="none"/>
  </defs>

  <!-- ─────────────── Outer rings ─────────────── -->

  <!-- Drop shadow disc -->
  <circle cx="113" cy="113" r="107" fill="rgba(5,12,35,0.35)"/>

  <!-- Gold outer ring -->
  <circle cx="110" cy="110" r="107" fill="url(#sg-gold)"/>

  <!-- Thin dark separator -->
  <circle cx="110" cy="110" r="103.5" fill="#14254d"/>

  <!-- Main navy body -->
  <circle cx="110" cy="110" r="102" fill="url(#sg-navy)"/>

  <!-- Inner decorative gold ring (double) -->
  <circle cx="110" cy="110" r="95.5" fill="none" stroke="#C9A843" stroke-width="1.5"  opacity="0.55"/>
  <circle cx="110" cy="110" r="92"   fill="none" stroke="#C9A843" stroke-width="0.6"  opacity="0.3"/>

  <!-- ─────────────── 24 tiny decorative dots around inner ring ─────────────── -->
  <!--
    Dots at every 15° on r=95.5.  Center=(110,110).
    Only dots above the SENDA text area (avoid the lettering band ~165-205)
    We'll place all 24 but make bottom ones very faint.
  -->
  <!-- Generated positions: angle from -90° in 15° steps -->
  <!-- Top band dots (fully visible) -->
  <circle cx="110"    cy="14.5"  r="1.6" fill="#C9A843" opacity="0.65"/>   <!-- -90° -->
  <circle cx="134.68" cy="17.06" r="1.6" fill="#C9A843" opacity="0.60"/>   <!-- -75° -->
  <circle cx="156.35" cy="25.9"  r="1.6" fill="#C9A843" opacity="0.55"/>   <!-- -60° -->
  <circle cx="173.15" cy="40.35" r="1.6" fill="#C9A843" opacity="0.50"/>   <!-- -45° -->
  <circle cx="183.61" cy="58.65" r="1.6" fill="#C9A843" opacity="0.45"/>   <!-- -30° -->
  <circle cx="186.5"  cy="79.5"  r="1.6" fill="#C9A843" opacity="0.40"/>   <!-- -15° -->
  <!-- Side dots -->
  <circle cx="205.5"  cy="110"   r="1.6" fill="#C9A843" opacity="0.35"/>   <!--   0° -->
  <circle cx="186.5"  cy="140.5" r="1.6" fill="#C9A843" opacity="0.25"/>   <!--  15° -->
  <circle cx="183.61" cy="161.35"r="1.6" fill="#C9A843" opacity="0.18"/>   <!--  30° -->
  <!-- Bottom band (very faint — SENDA text covers this zone) -->
  <circle cx="173.15" cy="179.65"r="1.6" fill="#C9A843" opacity="0.12"/>
  <circle cx="156.35" cy="194.1" r="1.6" fill="#C9A843" opacity="0.10"/>
  <circle cx="134.68" cy="202.94"r="1.6" fill="#C9A843" opacity="0.10"/>
  <circle cx="110"    cy="205.5" r="1.6" fill="#C9A843" opacity="0.10"/>
  <circle cx="85.32"  cy="202.94"r="1.6" fill="#C9A843" opacity="0.10"/>
  <circle cx="63.65"  cy="194.1" r="1.6" fill="#C9A843" opacity="0.10"/>
  <circle cx="46.85"  cy="179.65"r="1.6" fill="#C9A843" opacity="0.12"/>
  <circle cx="36.39"  cy="161.35"r="1.6" fill="#C9A843" opacity="0.18"/>
  <circle cx="33.5"   cy="140.5" r="1.6" fill="#C9A843" opacity="0.25"/>
  <circle cx="14.5"   cy="110"   r="1.6" fill="#C9A843" opacity="0.35"/>   <!-- 180° -->
  <circle cx="33.5"   cy="79.5"  r="1.6" fill="#C9A843" opacity="0.40"/>
  <circle cx="36.39"  cy="58.65" r="1.6" fill="#C9A843" opacity="0.45"/>
  <circle cx="46.85"  cy="40.35" r="1.6" fill="#C9A843" opacity="0.50"/>
  <circle cx="63.65"  cy="25.9"  r="1.6" fill="#C9A843" opacity="0.55"/>
  <circle cx="85.32"  cy="17.06" r="1.6" fill="#C9A843" opacity="0.60"/>

  <!-- ─────────────── Top circular text ─────────────── -->
  <text font-family="Georgia, 'Times New Roman', serif"
        font-size="10.5" font-weight="bold" fill="#C9A843" letter-spacing="3.2">
    <textPath href="#sg-topArc" xlink:href="#sg-topArc"
              startOffset="50%" text-anchor="middle">
      SISTEMA DE HORAS BECA
    </textPath>
  </text>

  <!-- Small diamond separators flanking the arc at 3 &amp; 9 o'clock -->
  <polygon points="19,110 22.2,106.8 25.4,110 22.2,113.2" fill="#C9A843" opacity="0.75"/>
  <polygon points="194.6,110 197.8,106.8 201,110 197.8,113.2" fill="#C9A843" opacity="0.75"/>

  <!-- ─────────────── Central symbol — La Senda ─────────────── -->
  <!--
    A sinuous S-curve connecting three waypoints that represent
    the hour-tracking lifecycle:
      ① Bottom node  — student starts work (PENDING)
      ② Middle node  — dept-head reviews (APPROVED)
      ③ Top node     — accounting closes (PROCESSED / star)

    Bezier: M 88,150  C 68,123 68,103 110,97  C 152,91 152,70 131,54
  -->

  <!-- Wide glow underneath the whole path -->
  <path d="M 88,150 C 68,123 68,103 110,97 C 152,91 152,70 131,54"
        fill="none" stroke="#C9A843" stroke-width="22"
        stroke-linecap="round" opacity="0.07"/>

  <!-- Road shoulder lines (left &amp; right borders of the senda) -->
  <path d="M 82,152 C 61,125 60,103 105,97 C 150,91 150,68 129,50"
        fill="none" stroke="#C9A843" stroke-width="1.1"
        stroke-linecap="round" opacity="0.40"/>
  <path d="M 94,148 C 75,121 76,103 115,97 C 155,91 154,72 133,58"
        fill="none" stroke="#C9A843" stroke-width="1.1"
        stroke-linecap="round" opacity="0.40"/>

  <!-- Main path stroke -->
  <path d="M 88,150 C 68,123 68,103 110,97 C 152,91 152,70 131,54"
        fill="none" stroke="#C9A843" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Center dashes (road markings — suggest the "hours" ticks) -->
  <path d="M 88,150 C 68,123 68,103 110,97 C 152,91 152,70 131,54"
        fill="none" stroke="#152644" stroke-width="0.9"
        stroke-linecap="round" stroke-dasharray="2.5,9" opacity="0.95"/>

  <!-- ① Start node — PENDING (bottom) -->
  <circle cx="88"  cy="150" r="12"  fill="#1d3261" stroke="#C9A843" stroke-width="2.5"/>
  <circle cx="88"  cy="150" r="4.5" fill="#C9A843"/>
  <!-- Roman I label -->
  <text x="88" y="150" dy="0.35em"
        font-family="Georgia, serif" font-size="6" font-weight="bold"
        fill="#1d3261" text-anchor="middle">I</text>

  <!-- ② Mid node — APPROVED (middle) -->
  <circle cx="110" cy="97"  r="10"  fill="#1d3261" stroke="#C9A843" stroke-width="2.5"/>
  <circle cx="110" cy="97"  r="3.5" fill="#C9A843"/>
  <!-- Roman II label -->
  <text x="110" y="97" dy="0.35em"
        font-family="Georgia, serif" font-size="5.5" font-weight="bold"
        fill="#1d3261" text-anchor="middle">II</text>

  <!-- ③ Top node — PROCESSED / destination (star) -->
  <g filter="url(#sg-glow)">
    <!-- Halo -->
    <circle cx="131" cy="54" r="14" fill="#C9A843" opacity="0.25"/>
    <!-- Gold disc -->
    <circle cx="131" cy="54" r="12" fill="#C9A843"/>
    <!-- 5-point star inscribed in the disc (outer r=7, inner r=3) -->
    <!-- Points interleaved outer/inner, starting from top (-90°) -->
    <polygon
      points="131,47
              132.76,52.57  137.66,52.84
              133.85,55.93  135.12,60.66
              131,58
              126.88,60.66  128.15,55.93
              124.34,52.84  129.24,52.57"
      fill="#1d3261"/>
  </g>

  <!-- ─────────────── SENDA lettering ─────────────── -->
  <!-- Shadow layer for legibility -->
  <text x="111" y="179"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-weight="bold"
        fill="rgba(5,12,35,0.5)" text-anchor="middle" letter-spacing="9">SENDA</text>
  <!-- Main white text -->
  <text x="110" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="9">SENDA</text>

  <!-- Gold horizontal rule -->
  <line x1="58" y1="186" x2="162" y2="186" stroke="#C9A843" stroke-width="1" opacity="0.5"/>

  <!-- UNADECA sub-label -->
  <text x="110" y="197"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="8.5" fill="#C9A843"
        text-anchor="middle" letter-spacing="4.5" opacity="0.85">
    UNADECA
  </text>
</svg>
